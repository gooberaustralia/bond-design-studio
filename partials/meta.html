<!-- @default
  title="Bond Design Studio — Website Project"
  description=""
  canonical="/"
  og_image="/assets/images/og-default.png"
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{canonical}}" />
<link rel="icon" type="image/png" href="/assets/images/favicon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icon-512.png" />
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
<link rel="shortcut icon" href="/assets/images/favicon.ico" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:image" content="{{og_image}}" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{title}}" />
<meta name="twitter:description" content="{{description}}" />

<!-- Fonts (heading + body pairing) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" />

<!-- Styles -->
<link rel="stylesheet" href="/assets/css/tokens.css" />
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="stylesheet" href="/assets/css/components.css" />

<!-- @use:tracking-head -->
