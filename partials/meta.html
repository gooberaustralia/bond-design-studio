<!-- @default
  title="Bond Design Studio"
  description=""
  canonical=""
  og_image="/assets/site/hero-wide.webp"
  robots="index, follow"
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">

<link rel="icon" href="/assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/images/favicon.webp">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.webp">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icon-512.webp">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.webp">
<meta name="theme-color" content="#FAFAF8">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Bond Design Studio">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:locale" content="en_AU">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">

<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/newsreader-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-latin.woff2" crossorigin>
<link rel="stylesheet" href="/css/site.css">

<script>
  // Set the theme before first paint so Night never flashes white.
  // The studio's identity is light, so Day is the default for everyone.
  (function () {
    try {
      var saved = localStorage.getItem('bds-theme');
      document.documentElement.setAttribute('data-theme', saved === 'night' ? 'night' : 'day');
    } catch (e) {}
  })();
</script>
