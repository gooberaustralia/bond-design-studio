<!--
  Enquiry auto-reply — the branded thank-you email sent to a person who submits
  a form. Edit here or regenerate from the Email panel.

  Runtime tokens (filled per submission by api/enquiry.js):
    {{name}}   {{message}}
  Build-time token (baked when you save): Bond Design Studio — Website Project
-->
<!doctype html>
<html>
  <body style="margin:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 0;">
      <tr><td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr><td style="padding:32px 40px 8px;">
            <h1 style="margin:0 0 8px;font-size:22px;">Thanks, {{name}}!</h1>
            <p style="margin:0;font-size:15px;line-height:1.6;color:#3f3f46;">
              We've received your enquiry and someone from Bond Design Studio — Website Project will be in touch shortly.
            </p>
          </td></tr>
          <tr><td style="padding:16px 40px 32px;">
            <p style="margin:0 0 6px;font-size:13px;color:#71717a;">Your message:</p>
            <div style="background:#f4f4f5;border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.6;color:#3f3f46;">
              {{message}}
            </div>
          </td></tr>
          <tr><td style="padding:0 40px 32px;font-size:12px;color:#a1a1aa;">
            This is an automated confirmation from Bond Design Studio — Website Project. Just reply if you need to add anything.
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
