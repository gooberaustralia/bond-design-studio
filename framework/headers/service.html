<!--
  GOOBER FRAMEWORK — Header: Service

  Two-row header: top info bar with phone + contact info,
  main nav below with logo, links, CTA button.
  Always solid white background.
  Best for: trades, construction, professional services, healthcare.

  Required IDs (populated by runtime.js):
    nav-logo-img, nav-logo-text, nav-links, nav-mobile, nav-phone, nav-cta
  Required data attrs:
    data-toggle-mobile-nav, data-mobile-nav
-->
<header id="site-header" class="header-shell header-solid" role="banner">

  <!-- Top info bar -->
  <div class="nav-top-bar" role="complementary" aria-label="Contact information">
    <span class="nav-top-bar-item">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.36 12 19.79 19.79 0 0 1 1.21 3.38 2 2 0 0 1 3.18 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6.13 6.13l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <a id="top-bar-phone" href="#" style="color:inherit; text-decoration:none;"></a>
    </span>
    <span class="nav-top-bar-item" id="top-bar-hours" style="display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="top-bar-hours-text"></span>
    </span>
    <span class="nav-top-bar-item" id="top-bar-area" style="display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span id="top-bar-area-text"></span>
    </span>
  </div>

  <!-- Main nav -->
  <nav class="nav-container" aria-label="Main navigation">

    <!-- Logo -->
    <a href="/" class="nav-logo" aria-label="Go to homepage">
      <img id="nav-logo-img" src="" alt="" width="160" height="40" style="display:none;" />
      <span id="nav-logo-text" style="display:none;"></span>
    </a>

    <!-- Desktop nav links -->
    <ul id="nav-links" class="nav-links" role="list"></ul>

    <!-- Actions -->
    <div class="nav-actions">
      <a id="nav-phone" href="#" class="nav-phone" style="display:none;" aria-label="Call us"></a>
      <a id="nav-cta" href="/contact" class="btn btn-primary btn-sm">Get a Free Quote</a>
    </div>

    <!-- Hamburger -->
    <button
      class="nav-hamburger"
      data-toggle-mobile-nav
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="nav-mobile"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile nav panel -->
  <ul id="nav-mobile" class="nav-mobile" data-mobile-nav role="list"></ul>
</header>
