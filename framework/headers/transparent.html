<!--
  GOOBER FRAMEWORK — Header: Transparent

  Full-width transparent header that starts over a hero image.
  Becomes solid white on scroll (.scrolled class added by runtime.js).
  Logo is white when transparent, dark when scrolled.
  Best for: creative, luxury, photography, interior design sites.

  Required IDs (populated by runtime.js):
    nav-logo-img, nav-logo-text, nav-links, nav-mobile, nav-phone, nav-cta
  Required data attrs:
    data-toggle-mobile-nav, data-mobile-nav
-->
<header id="site-header" class="header-shell header-transparent" role="banner">
  <nav class="nav-container" aria-label="Main navigation">

    <!-- Logo -->
    <a href="/" class="nav-logo" aria-label="Go to homepage">
      <img id="nav-logo-img" src="" alt="" width="160" height="40" style="display:none;" />
      <span id="nav-logo-text" style="display:none;"></span>
    </a>

    <!-- Desktop nav links (populated by runtime.js) -->
    <ul id="nav-links" class="nav-links" role="list"></ul>

    <!-- Actions -->
    <div class="nav-actions">
      <a id="nav-phone" href="#" class="nav-phone" style="display:none;" aria-label="Call us"></a>
      <a id="nav-cta" href="/contact" class="btn btn-white btn-sm">Get a Quote</a>
    </div>

    <!-- Hamburger (mobile) -->
    <button
      class="nav-hamburger"
      data-toggle-mobile-nav
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="nav-mobile"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile nav panel (populated by runtime.js) -->
  <ul id="nav-mobile" class="nav-mobile" data-mobile-nav role="list"></ul>
</header>
