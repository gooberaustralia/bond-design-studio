<html lang="en">

  <meta property="og:title" content="<!-- OG_TITLE -->">
  <meta property="og:description" content="<!-- OG_DESC -->">
  <meta property="og:image" content="<!-- OG_IMAGE -->">
  <meta property="og:type" content="article">
  <meta property="og:url" content="<!-- CANONICAL -->">
  <meta property="article:published_time" content="<!-- PUBLISHED_AT -->">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="<!-- TWITTER_HANDLE -->">

  <!-- Canonical -->
  <link rel="canonical" href="<!-- CANONICAL -->">

  <!-- Theme -->
  <meta name="theme-color" content="<!-- PRIMARY_COLOR -->">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Framework CSS -->
  <link rel="stylesheet" href="/framework/css/core.css">
  <link rel="stylesheet" href="/framework/css/components.css">

  <!-- Blog post article schema -->
  <!-- SCHEMA_MARKUP -->

  <!-- INTEGRATIONS_HEAD -->

  <!-- Custom head code -->
  <!-- HEAD_CODE -->

  <style>
    /* Blog post article layout */
    .blog-post-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-2xl);
      max-width: var(--container-max, 1200px);
      margin-inline: auto;
      padding-inline: var(--container-padding);
    }
    .blog-post-article {
      max-width: 720px;
    }
    .blog-post-header {
      margin-bottom: var(--space-xl);
    }
    .blog-post-featured-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-xl);
    }
    .blog-post-meta {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      flex-wrap: wrap;
      color: var(--color-text-muted);
      font-size: 0.875rem;
      margin-bottom: var(--space-md);
    }
    .blog-post-content {
      font-size: 1.0625rem;
      line-height: 1.8;
      color: var(--color-text);
    }
    .blog-post-content h2 { margin-top: var(--space-xl); }
    .blog-post-content h3 { margin-top: var(--space-lg); }
    .blog-post-content img {
      border-radius: var(--radius);
      margin-block: var(--space-lg);
    }
    .blog-post-content blockquote {
      margin: var(--space-lg) 0;
      padding: var(--space-md) var(--space-lg);
      border-left: 4px solid var(--color-primary);
      background: var(--color-bg-alt);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .blog-post-author {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-lg);
      background: var(--color-bg-alt);
      border-radius: var(--radius-lg);
      margin-top: var(--space-2xl);
    }
    .blog-post-author img {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-full);
      object-fit: cover;
      flex-shrink: 0;
    }
    .blog-post-sidebar {
      display: none;
    }
    @media (min-width: 1024px) {
      .blog-post-layout {
        grid-template-columns: 1fr 300px;
        padding-top: var(--space-2xl);
        padding-bottom: var(--space-2xl);
      }
      .blog-post-sidebar {
        display: block;
      }
    }
    .sidebar-widget {
      background: var(--color-bg-alt);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .sidebar-widget h4 {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: var(--space-md);
    }
  </style>
</head>
<body>

  <!-- Body start code -->
  <!-- BODY_START_CODE -->

  <!-- Header -->
  <!-- HEADER_HTML -->

  <!-- Blog post layout -->
  <main id="page-content" data-page="<!-- SLUG -->">
    <div class="section">
      <div class="blog-post-layout">

        <!-- Main article -->
        <article class="blog-post-article">

          <!-- Article header -->
          <header class="blog-post-header">
            <span class="badge badge-primary" style="margin-bottom:var(--space-sm);"><!-- CATEGORY --></span>
            <h1><!-- POST_TITLE --></h1>
            <div class="blog-post-meta">
              <time datetime="<!-- PUBLISHED_ISO -->"><!-- PUBLISHED_DISPLAY --></time>
              <span>·</span>
              <span>By <!-- AUTHOR_NAME --></span>
              <span>·</span>
              <span><!-- READ_TIME --> min read</span>
            </div>
          </header>

          <!-- Featured image -->
          <img
            class="blog-post-featured-image"
            src="<!-- FEATURED_IMAGE -->"
            alt="<!-- POST_TITLE -->"
            width="720"
            height="405"
            loading="eager"
            decoding="async"
          />

          <!-- Article body -->
          <div class="blog-post-content">
            <!-- CONTENT_HTML -->
          </div>

          <!-- Author bio -->
          <div class="blog-post-author">
            <img src="<!-- AUTHOR_AVATAR -->" alt="<!-- AUTHOR_NAME -->" width="64" height="64" />
            <div>
              <p style="font-weight:700; margin-bottom:4px;"><!-- AUTHOR_NAME --></p>
              <p style="color:var(--color-text-muted); font-size:0.875rem; margin:0;"><!-- AUTHOR_BIO --></p>
            </div>
          </div>

        </article>

        <!-- Sidebar -->
        <aside class="blog-post-sidebar">

          <!-- CTA widget -->
          <div class="sidebar-widget" style="background:var(--color-primary); color:#FFFFFF; text-align:center;">
            <h4 style="color:rgba(255,255,255,0.8);">Get a Free Quote</h4>
            <p style="color:rgba(255,255,255,0.85); font-size:0.9375rem; margin-bottom:var(--space-md);">Ready to get started? Contact us today.</p>
            <a id="sidebar-cta" href="/contact" class="btn btn-white btn-sm" style="width:100%;">Contact Us</a>
          </div>

          <!-- Related posts -->
          <div class="sidebar-widget" id="sidebar-related">
            <h4>More Articles</h4>
            <!-- RELATED_POSTS -->
          </div>

        </aside>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <!-- FOOTER_HTML -->

  <!-- Mobile CTA bar -->
  <!-- MOBILE_CTA_HTML -->

  <!-- Site config -->
  <script>
  window.__SITE_CONFIG__ = <!-- SITE_CONFIG_JSON -->;
  </script>

  <!-- Framework runtime -->
  <script src="/framework/js/runtime.js"></script>

  <!-- Integration body end codes -->

  <!-- Custom footer code -->

</body>
</html>
