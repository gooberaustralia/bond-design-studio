<!--
  GOOBER FRAMEWORK — Footer: Dark

  Full-width dark footer. Logo centred, nav centred,
  social centred. Strong bottom section.
  Best for: bold brands, agencies, tech, security.

  Required IDs (populated by runtime.js):
    footer-business-name, footer-tagline, footer-phone, footer-email,
    footer-address, footer-copyright, footer-links, footer-social
-->
<footer class="site-footer" id="site-footer" role="contentinfo" style="background:var(--section-dark-bg,#0F172A); color:#FFFFFF;">
  <div class="container" style="padding-top:var(--space-2xl); padding-bottom:var(--space-xl);">

    <!-- Centred logo + tagline -->
    <div style="text-align:center; margin-bottom:var(--space-xl);">
      <a href="/" style="display:inline-block; margin-bottom:var(--space-md);">
        <img id="footer-logo-img" src="" alt="" width="160" height="48" style="display:none;" />
        <span id="footer-logo-text" style="font-family:var(--font-heading,sans-serif); font-weight:700; font-size:1.5rem; color:#FFFFFF;"></span>
      </a>
      <p id="footer-tagline" style="color:rgba(255,255,255,0.6); max-width:480px; margin:0 auto; font-size:1rem; line-height:1.6;"></p>
    </div>

    <!-- Centred nav links -->
    <nav style="text-align:center; margin-bottom:var(--space-xl);" aria-label="Footer navigation">
      <ul id="footer-links" style="list-style:none; padding:0; margin:0; display:inline-flex; flex-wrap:wrap; justify-content:center; gap:8px 32px;" role="list"></ul>
    </nav>

    <!-- Contact row -->
    <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:var(--space-md) var(--space-xl); margin-bottom:var(--space-xl); font-size:0.9375rem;">
      <div class="footer-contact-item" style="display:flex; align-items:center; gap:8px; color:rgba(255,255,255,0.7);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.36 12 19.79 19.79 0 0 1 1.21 3.38 2 2 0 0 1 3.18 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6.13 6.13l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <a id="footer-phone" href="#" style="color:rgba(255,255,255,0.85); text-decoration:none; font-weight:600;"></a>
      </div>
      <div class="footer-contact-item" style="display:flex; align-items:center; gap:8px; color:rgba(255,255,255,0.7);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <a id="footer-email" href="#" style="color:rgba(255,255,255,0.85); text-decoration:none;"></a>
      </div>
      <div class="footer-contact-item" style="display:flex; align-items:center; gap:8px; color:rgba(255,255,255,0.7);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <address id="footer-address" style="font-style:normal; color:rgba(255,255,255,0.7);"></address>
      </div>
    </div>

    <!-- Social icons (centred) -->
    <div id="footer-social" style="display:flex; justify-content:center; gap:12px; margin-bottom:var(--space-xl);" aria-label="Social media links"></div>

    <!-- Bottom bar -->
    <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:var(--space-md); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--space-sm);">
      <p id="footer-copyright" style="color:rgba(255,255,255,0.4); font-size:0.8125rem; margin:0;"></p>
      <p id="footer-abn" style="color:rgba(255,255,255,0.4); font-size:0.8125rem; margin:0;"></p>
    </div>

  </div>
</footer>

<style>
  #site-footer #footer-links a {
    color: rgba(255,255,255,0.65);
    text-decoration: none;
    font-size: 0.9375rem;
    transition: color var(--transition, 200ms ease);
  }
  #site-footer #footer-links a:hover { color: #FFFFFF; }
  #site-footer #footer-social a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: var(--radius-full, 9999px);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.75rem;
    transition: background var(--transition, 200ms ease);
  }
  #site-footer #footer-social a:hover { background: var(--color-primary, #2563EB); color: #FFFFFF; }
</style>
